# Tag-triggered release, and a dry run of the same jobs from any branch.
#
#   git tag -a v0.1.0 -m "Release 0.1.0"
#   git push origin v0.1.0
#
# ## The dry run
#
# A dispatch run is always a dry run. There is no input that makes one publish,
# so the only way to touch a release is to push a tag. The tarball is packed,
# installed by git ref, and checked, `npm publish` runs with `--dry-run` and no
# token, and `dry-run-artifacts` asserts the file exists rather than letting an
# empty run look green. See `docs/ci.md`.
#
# ## Why every asset lands on a DRAFT
#
# GitHub immutable releases reject an asset added after publish with HTTP 422.
# So the release is created as a draft, every build job attaches to that draft,
# and a single `publish` job flips it once at the end. This is the shape
# stuffbucket/maximal uses, for exactly this reason.
#
# ## There is no installer
#
# No MSI and no dmg. Three jobs here built them. One had never once succeeded,
# and the other shipped an installer containing zero files. See
# `docs/release.md`. The tarball is the artifact, and `publish` gates on it.

name: release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

# A dry run must never queue behind a release, or hold one up.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('release-dry-{0}', github.ref) || 'release' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  # Fail before the matrix spends any minutes. Mirrors codex's `tag-check`.
  tag-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `verify:tag` reads the workflow runs on this ref. A tag deletion does
      # not remove them, which is what makes them the record a re-cut cannot
      # hide from.
      actions: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - name: Resolve the tag and validate it against package.json
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          pkg_ver="$(node -p "require('./package.json').version")"

          if [[ "${DRY_RUN}" == "true" ]]; then
            tag="v${pkg_ver}"
          else
            [[ "${GITHUB_REF_TYPE}" == "tag" ]] \
              || { echo "::error::Not a tag ref"; exit 1; }
            tag="${GITHUB_REF_NAME}"
          fi

          [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta)(\.[0-9]+)?)?$ ]] \
            || { echo "::error::Tag '${tag}' does not match the expected format"; exit 1; }

          [[ "${tag#v}" == "${pkg_ver}" ]] \
            || { echo "::error::Tag ${tag#v} != package.json ${pkg_ver}"; exit 1; }

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Tag and package.json agree (${pkg_ver})"

      # A published tag is immutable, and nothing enforced that: `v0.0.2` was
      # deleted and re-pushed onto another commit eight minutes later, and both
      # runs are still listed on the ref. This refuses the second one. A dry
      # run has no tag, so it checks the ordering alone and says so.
      - name: Refuse a tag that has already been cut
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${DRY_RUN}" == "true" ]]; then
            node scripts/verify-tag.mjs --tag "$TAG"
          else
            node scripts/verify-tag.mjs --tag "$TAG" --sha "$GITHUB_SHA"
          fi

  release:
    needs: tag-check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.tag-check.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Create the draft release
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists — reusing it."
            exit 0
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --draft \
            --generate-notes
      - name: Dry run, so no release is created
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: echo "Dry run for ${TAG}. Nothing is created, attached, or published."

  # What a consumer installs, and the only artifact a release carries.
  # `stuffbucket/maximal` depends on this shell as a library and packages and
  # signs its own application, so the tarball is the artifact that matters.
  #
  # `publish` gates on this job alone. Gating it on an installer made a package
  # release depend on a credential for a private signing repository, which is
  # how `v0.0.1` produced a draft nobody could publish.
  package-tarball:
    needs: [tag-check, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.tag-check.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # `npm pack` runs prepack, which builds `dist`. Nothing is committed.
      - name: Pack, and assert the exports are in it
        run: |
          set -euo pipefail
          npm run verify:exports
          # npm pack does not create the destination, and fails with ENOENT.
          mkdir -p dist-release
          npm pack --pack-destination dist-release
          shopt -s nullglob
          files=(dist-release/*.tgz)
          [[ ${#files[@]} -eq 1 ]] \
            || { echo "::error::Expected one tarball, found ${#files[@]}"; exit 1; }
          echo "Packed $(basename "${files[0]}")"

      - uses: actions/upload-artifact@v4
        with:
          name: package-tarball
          path: dist-release/*.tgz
          if-no-files-found: error

      # The other install path. `npm pack` runs `prepack`; a consumer pinning a
      # git ref gets `prepare`, and a tag has shipped with only the first wired.
      # Issue #83. The commit rather than the tag name, because a dry run has no
      # tag to resolve and the two name the same objects on a tag push.
      - name: Install this commit by git ref, the way a consumer pins it
        env:
          REPOSITORY: github:${{ github.repository }}
          REF: ${{ github.sha }}
        run: npm run verify:git-install -- --repository "$REPOSITORY" --ref "$REF"

      - name: Attach the tarball to the draft
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist-release/*.tgz)
          gh release upload "$TAG" "${files[0]}" --repo "$GITHUB_REPOSITORY" --clobber
          echo "Attached $(basename "${files[0]}")"

  publish:
    if: github.event_name != 'workflow_dispatch'
    needs: package-tarball
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Flip the draft to published
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          echo "Published ${TAG}"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'

  # The npm registry publish, to GitHub Packages. No secret is added for it:
  # `GITHUB_TOKEN` with `packages: write` publishes to the registry for the
  # repository the workflow runs in, and the scope has to be the account that
  # owns that repository.
  #
  # It publishes the artifact `package-tarball` produced rather than packing a
  # second time, so the bytes that were checked are the bytes that go up.
  #
  # `publish` does not gate on this, for the reason it does not gate on the
  # installers: a registry failure must not strand a draft nobody can publish.
  # A version cannot be republished, so a failure here is fixed by cutting the
  # next patch, the same way a bad tag is.
  publish-package:
    needs: [tag-check, package-tarball]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ needs.tag-check.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@stuffbucket'
      - uses: actions/download-artifact@v4
        with:
          name: package-tarball
          path: dist-release

      - name: Check what would be published
        shell: bash
        run: node scripts/verify-publish.mjs dist-release --version "$TAG"

      # No token, deliberately. The condition above is the guard; an invalid
      # `NODE_AUTH_TOKEN` is the second one, so a dispatch that somehow reached
      # the registry authenticates as nobody.
      #
      # `./` is load-bearing. Without it npm reads `dist-release/name.tgz` as
      # an `owner/repo` git shorthand and clones over SSH. The first dry run
      # found that, which is what the dry run is for.
      - name: Dry run, so nothing is published
        if: github.event_name == 'workflow_dispatch'
        env:
          NODE_AUTH_TOKEN: dry-run-carries-no-token
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist-release/*.tgz)
          npm publish "./${files[0]}" --dry-run
          echo "Dry run for ${TAG}. Nothing was uploaded to any registry."

      - name: Publish to GitHub Packages
        if: github.event_name != 'workflow_dispatch'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist-release/*.tgz)
          npm publish "./${files[0]}"
          echo "Published $(basename "${files[0]}") to https://npm.pkg.github.com"

  # The dry run's terminal job. Every attach step above is skipped on a
  # dispatch, so without this a run that produced nothing would end green.
  #
  # It outlived the installers rather than going with them. One artifact is not
  # zero artifacts, and `if-no-files-found: error` is not this check: that
  # setting proves a file existed in the producing job's own directory. It says
  # nothing about whether the name resolves on the download side, which is what
  # #81 was, or whether the file that crossed has any bytes.
  dry-run-artifacts:
    if: github.event_name == 'workflow_dispatch'
    needs: [package-tarball, publish-package]
    runs-on: ubuntu-latest
    steps:
      # By name, not the whole run. An unnamed download would pass by finding
      # some other job's artifact, and `tests/workflows.test.ts` pairs the name
      # against the upload.
      - uses: actions/download-artifact@v4
        with:
          name: package-tarball
          path: artifacts
      - name: Assert the release would have had something to attach
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          tarballs=(artifacts/*.tgz)

          [[ ${#tarballs[@]} -eq 1 ]] \
            || { echo "::error::Expected one tarball, found ${#tarballs[@]}"; exit 1; }

          file="${tarballs[0]}"
          [[ -s "$file" ]] || { echo "::error::Missing or empty: ${file}"; exit 1; }
          echo "$(stat -c %s "$file") bytes  ${file}"
