# Temporary. Issue #149: which rung of the ladder does getLlama() hang on?
#
# Bare node, an Electron main process, an Electron utilityProcess, and the same
# three against a packaged tree. Deleted once the answer is in the issue.

name: llama-probe

on:
  push:
    branches: ['fix/windows-getllama']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unpackaged:
    name: rungs 1-3 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: rung 1, bare node
        timeout-minutes: 8
        run: node probe/bare.mjs

      - name: rungs 2 and 3, electron main and utilityProcess
        timeout-minutes: 15
        env:
          PROBE_ROOT: ${{ github.workspace }}
          ELECTRON_ENABLE_LOGGING: '1'
        run: npx electron probe/electron-main.js

  packaged:
    name: rung 4 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            binary: out/Stuffbucket-win32-x64/Stuffbucket.exe
            unpacked: out/Stuffbucket-win32-x64/resources/app.asar.unpacked
            asar: out/Stuffbucket-win32-x64/resources/app.asar
          - os: macos-latest
            binary: out/Stuffbucket-darwin-arm64/Stuffbucket.app/Contents/MacOS/Stuffbucket
            unpacked: out/Stuffbucket-darwin-arm64/Stuffbucket.app/Contents/Resources/app.asar.unpacked
            asar: out/Stuffbucket-darwin-arm64/Stuffbucket.app/Contents/Resources/app.asar
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package

      - name: what the package ships
        run: node probe/scope.mjs "${{ matrix.unpacked }}"

      - name: rung 4a, the packaged tree under an unfused Electron
        timeout-minutes: 15
        env:
          PROBE_ROOT: ${{ github.workspace }}/${{ matrix.unpacked }}
          ELECTRON_ENABLE_LOGGING: '1'
        run: npx electron probe/electron-main.js

      - name: rung 4b, can the packaged binary start a node child of itself
        timeout-minutes: 5
        run: node probe/fuse-fork.mjs "${{ matrix.binary }}"

      - name: rung 3.5, the application's own engine bundle, unpackaged
        timeout-minutes: 10
        env:
          ELECTRON_ENABLE_LOGGING: '1'
        run: npx electron probe/engine-main.js .vite/build/llama-worker.js

      - name: rung 4d, the engine bundle inside app.asar
        timeout-minutes: 10
        env:
          ELECTRON_ENABLE_LOGGING: '1'
        run: npx electron probe/engine-main.js "${{ matrix.asar }}/.vite/build/llama-worker.js"
