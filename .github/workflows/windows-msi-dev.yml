# Windows MSI fast-iteration harness (manual).
#
# The real MSI is only exercised by the release workflow against a tag. That
# makes iterating on installer changes a full release round-trip. This closes
# the gap: it builds and verifies the MSI from any branch, with no release.
#
# Modeled on maximal's windows-installer-dev.yml, and for the same reason.
#
# Trigger: Actions tab -> "windows msi (dev)" -> Run workflow, pick a branch.

name: windows msi (dev)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Synthetic version for the dev build (no leading v)'
        required: false
        default: '0.0.0'

concurrency:
  group: windows-msi-dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  msi:
    runs-on: windows-2022
    env:
      VERSION: ${{ github.event.inputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Stamp version
        shell: bash
        run: |
          set -euo pipefail
          node -e '
            const fs = require("node:fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.version = process.argv[1];
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          ' "$VERSION"

      - run: npm run package -- --arch=x64 --platform=win32
      - run: npm run verify:package

      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          $userBin = Join-Path $env:USERPROFILE '.dotnet\tools'
          echo $userBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$userBin\wix.exe" extension add -g WixToolset.Util.wixext/5.0.2

      - name: Build MSI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path dist-release -Force | Out-Null
          wix build build\windows\app.wxs `
            -d "Version=$env:VERSION" `
            -arch x64 `
            -bindpath "AppDir=out\Stuffbucket-win32-x64" `
            -ext WixToolset.Util.wixext `
            -out "dist-release\stuffbucket-dev-windows-x64.msi"

      - name: Install, assert, uninstall, assert
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = "dist-release\stuffbucket-dev-windows-x64.msi"

          $p = Start-Process msiexec -ArgumentList "/i","`"$msi`"","/qn","/l*v","install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 60; Write-Error "Install failed: $($p.ExitCode)" }

          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Stuffbucket'
          if (-not (Test-Path "$dir\Stuffbucket.exe")) { Write-Error "Stuffbucket.exe missing" }
          $marker = Get-ItemProperty -Path 'HKCU:\Software\stuffbucket\Stuffbucket' -Name installed
          if ($marker.installed -ne 1) { Write-Error "HKCU marker not set" }

          $p = Start-Process msiexec -ArgumentList "/x","`"$msi`"","/qn" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "Uninstall failed: $($p.ExitCode)" }
          if (Test-Path "$dir\Stuffbucket.exe") { Write-Error "Files left behind" }

          Write-Host "MSI install and removal verified."

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi-dev
          path: |
            dist-release/*.msi
            install.log
          if-no-files-found: warn
