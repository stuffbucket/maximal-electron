# Windows MSI fast-iteration harness (manual).
#
# The real MSI is only exercised by the release workflow against a tag. That
# makes iterating on installer changes a full release round-trip. This closes
# the gap: it builds and verifies the MSI from any branch, with no release.
#
# Modeled on maximal's windows-installer-dev.yml, and for the same reason.
#
# Trigger: Actions tab -> "windows msi (dev)" -> Run workflow, pick a branch.

name: windows msi (dev)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Synthetic version for the dev build (no leading v)'
        required: false
        default: '0.0.0'

concurrency:
  group: windows-msi-dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  msi:
    runs-on: windows-2022
    env:
      VERSION: ${{ github.event.inputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Stamp version
        shell: bash
        run: |
          set -euo pipefail
          node -e '
            const fs = require("node:fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.version = process.argv[1];
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          ' "$VERSION"

      - run: npm run package -- --arch=x64 --platform=win32
      - run: npm run verify:package

      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          $userBin = Join-Path $env:USERPROFILE '.dotnet\tools'
          echo $userBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$userBin\wix.exe" extension add -g WixToolset.Util.wixext/5.0.2

      - name: Build MSI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\scripts\build-msi.ps1 `
            -Version "$env:VERSION" `
            -Out "dist-release\stuffbucket-dev-windows-x64.msi"

      - name: Install, assert, launch, uninstall, assert
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\scripts\verify-msi.ps1 -Msi "dist-release\stuffbucket-dev-windows-x64.msi"

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi-dev
          path: |
            dist-release/*.msi
            dist-release/*.files.txt
            install.log
          if-no-files-found: warn
